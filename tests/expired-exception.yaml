policy:
  name: ubuntu-compliance-expired-exception
  version: "1.0"
  baseline_mode: fail_on_new

rules:
  default:
    on_fail: warn

  severity:
    high: fail
    medium: warn
    low: warn
    unknown: fail

exceptions:
  - id: xccdf_org.ssgproject.content_rule_package_vsftpd_removed
    expires: "2025-12-31"
    justification: >
      This exception is intentionally expired to verify that expired
      exceptions no longer suppress findings.
